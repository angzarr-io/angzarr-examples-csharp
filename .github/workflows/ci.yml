name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/angzarr-io/examples-csharp
  COORDINATOR_VERSION: latest
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Generate proto code
        run: buf generate

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Angzarr.Examples.sln

      - name: Build
        run: dotnet build Angzarr.Examples.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Angzarr.Examples.sln --configuration Release --no-build --verbosity normal --filter "TestCategory!=Acceptance&TestCategory!=e2e&TestCategory!=sync-mode&TestCategory!=cascade-error"

  build-images:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target:
          - agg-player
          - agg-table
          - agg-hand
          - saga-table-hand
          - saga-table-player
          - saga-hand-table
          - saga-hand-player
          - pmg-hand-flow
          - prj-output
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Generate proto code
        run: buf generate

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: tags
        run: |
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUM="${{ github.event.pull_request.number }}"
            echo "tags=${{ env.IMAGE_PREFIX }}-${{ matrix.target }}:pr-${PR_NUM}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          else
            echo "tags=${{ env.IMAGE_PREFIX }}-${{ matrix.target }}:${SHORT_SHA},${{ env.IMAGE_PREFIX }}-${{ matrix.target }}:latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image for acceptance tests
        if: github.event_name == 'pull_request'
        run: docker save -o /tmp/${{ matrix.target }}.tar "${{ steps.tags.outputs.tags }}"

      - name: Upload image artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.target }}
          path: /tmp/${{ matrix.target }}.tar
          retention-days: 1

  # Compute image tag for acceptance tests
  compute-tag:
    name: Compute Image Tag
    runs-on: ubuntu-latest
    needs: build-images
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      images-json: ${{ steps.images.outputs.json }}
    steps:
      - name: Generate image tag
        id: tag
        run: |
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUM="${{ github.event.pull_request.number }}"
            echo "tag=pr-${PR_NUM}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          else
            echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Build images JSON
        id: images
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          PREFIX: ${{ env.IMAGE_PREFIX }}
        run: |
          JSON=$(cat <<EOF
          {
            "agg-player": "${PREFIX}-agg-player:${TAG}",
            "agg-table": "${PREFIX}-agg-table:${TAG}",
            "agg-hand": "${PREFIX}-agg-hand:${TAG}",
            "saga-table-hand": "${PREFIX}-saga-table-hand:${TAG}",
            "saga-table-player": "${PREFIX}-saga-table-player:${TAG}",
            "saga-hand-table": "${PREFIX}-saga-hand-table:${TAG}",
            "saga-hand-player": "${PREFIX}-saga-hand-player:${TAG}",
            "pmg-hand-flow": "${PREFIX}-pmg-hand-flow:${TAG}",
            "prj-output": "${PREFIX}-prj-output:${TAG}"
          }
          EOF
          )
          echo "json=$(echo "$JSON" | jq -c '.')" >> $GITHUB_OUTPUT

  acceptance-test:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    needs: [build-images, compute-tag]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Parse image inputs
        id: images
        env:
          VERSION: ${{ env.COORDINATOR_VERSION }}
        run: |
          COORD=$(cat <<EOF
          {
            "aggregate": "ghcr.io/angzarr-io/angzarr-aggregate:${VERSION}",
            "saga": "ghcr.io/angzarr-io/angzarr-saga:${VERSION}",
            "projector": "ghcr.io/angzarr-io/angzarr-projector:${VERSION}",
            "process-manager": "ghcr.io/angzarr-io/angzarr-process-manager:${VERSION}",
            "stream": "ghcr.io/angzarr-io/angzarr-stream:${VERSION}",
            "gateway": "ghcr.io/angzarr-io/angzarr-grpc-gateway:${VERSION}",
            "log": "ghcr.io/angzarr-io/angzarr-log:${VERSION}"
          }
          EOF
          )
          echo "coordinators=$(echo "$COORD" | jq -c '.')" >> $GITHUB_OUTPUT

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: angzarr-test
          config: deploy/kind/cluster.yaml
          node_image: kindest/node:v1.31.0
          wait: 120s

      - name: Create namespace
        run: kubectl create namespace angzarr-test --dry-run=client -o yaml | kubectl apply -f -

      - name: Create image pull secret
        env:
          REGISTRY_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
        run: |
          kubectl create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password="${REGISTRY_TOKEN}" \
            --namespace=angzarr-test \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl patch serviceaccount default -n angzarr-test \
            -p '{"imagePullSecrets": [{"name": "ghcr-pull-secret"}]}' || true

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}

      - name: Log in to Helm registry
        run: echo "${{ secrets.GHCR_TOKEN || github.token }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull and load coordinator images
        run: |
          IMAGES='${{ steps.images.outputs.coordinators }}'
          echo "Pulling coordinator images..."
          echo "$IMAGES" | jq -r 'to_entries[] | "\(.key): \(.value)"'
          echo "$IMAGES" | jq -r 'to_entries[] | .value' | while read img; do
            echo "Pulling $img..."
            docker pull "$img"
            kind load docker-image "$img" --name angzarr-test
          done

      - name: Download image artifacts
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        with:
          path: /tmp/images
          pattern: image-*

      - name: Load example images into Kind (PR)
        if: github.event_name == 'pull_request'
        run: |
          for tarball in /tmp/images/image-*/*.tar; do
            echo "Loading $tarball..."
            kind load image-archive "$tarball" --name angzarr-test
          done

      - name: Pull and load example images (push)
        if: github.event_name != 'pull_request'
        run: |
          IMAGES='${{ needs.compute-tag.outputs.images-json }}'
          echo "Pulling example images..."
          echo "$IMAGES" | jq -r 'to_entries[] | "\(.key): \(.value)"'
          echo "$IMAGES" | jq -r 'to_entries[] | .value' | while read img; do
            echo "Pulling $img..."
            docker pull "$img"
            kind load docker-image "$img" --name angzarr-test
          done

      - name: Deploy infrastructure
        run: |
          echo "Deploying PostgreSQL..."
          helm upgrade --install angzarr-db \
            oci://ghcr.io/angzarr-io/charts/angzarr-db-postgres-simple \
            --namespace angzarr-test \
            --wait --timeout 2m
          echo "Deploying RabbitMQ..."
          helm upgrade --install angzarr-mq \
            oci://ghcr.io/angzarr-io/charts/angzarr-mq-rabbitmq-simple \
            --namespace angzarr-test \
            --wait --timeout 3m
          echo "Infrastructure deployed"

      - name: Create gateway descriptor configmap
        run: |
          # Generate protobuf descriptor set for the gRPC gateway
          # The gateway uses this to transcode HTTP/JSON to gRPC
          cd angzarr-project/proto
          buf build -o /tmp/types.bin
          cd ../..
          kubectl create configmap gateway-descriptor \
            --from-file=types.bin=/tmp/types.bin \
            --namespace angzarr-test

      - name: Deploy with Helm
        env:
          TAG: ${{ needs.compute-tag.outputs.tag }}
          COORD_VER: ${{ env.COORDINATOR_VERSION }}
        run: |
          helm upgrade --install angzarr-csharp \
            oci://ghcr.io/angzarr-io/charts/angzarr \
            --version 0.5.1 \
            -f deploy/k8s/helm/values.yaml \
            -f deploy/k8s/helm/values-ci.yaml \
            --set images.aggregate.tag="${COORD_VER}" \
            --set images.saga.tag="${COORD_VER}" \
            --set images.projector.tag="${COORD_VER}" \
            --set images.processManager.tag="${COORD_VER}" \
            --set images.stream.tag="${COORD_VER}" \
            --set images.gateway.tag="${COORD_VER}" \
            --set images.log.tag="${COORD_VER}" \
            --set "applications.business[0].image.tag=${TAG}" \
            --set "applications.business[0].debug.enabled=true" \
            --set "applications.business[0].debug.nodePort=31310" \
            --set "applications.business[1].image.tag=${TAG}" \
            --set "applications.business[1].debug.enabled=true" \
            --set "applications.business[1].debug.nodePort=31311" \
            --set "applications.business[2].image.tag=${TAG}" \
            --set "applications.business[2].debug.enabled=true" \
            --set "applications.business[2].debug.nodePort=31312" \
            --set "applications.sagas[0].image.tag=${TAG}" \
            --set "applications.sagas[1].image.tag=${TAG}" \
            --set "applications.sagas[2].image.tag=${TAG}" \
            --set "applications.sagas[3].image.tag=${TAG}" \
            --set "applications.projectors[0].image.tag=${TAG}" \
            --set "applications.processManagers[0].image.tag=${TAG}" \
            -n angzarr-test \
            --wait --timeout 5m

      - name: Smoke test - verify pods are running
        run: |
          echo "=== Waiting for pods to be ready ==="
          kubectl wait --for=condition=ready pod --all -n angzarr-test --timeout=300s || true

          echo ""
          echo "=== Pod Status ==="
          kubectl get pods -n angzarr-test -o wide

          echo ""
          echo "=== Services ==="
          kubectl get svc -n angzarr-test

          # Verify at least the aggregate pods are running
          RUNNING=$(kubectl get pods -n angzarr-test --field-selector=status.phase=Running -o name | wc -l)
          echo ""
          echo "Running pods: $RUNNING"

          if [ "$RUNNING" -lt 3 ]; then
            echo "ERROR: Expected at least 3 running pods (aggregates), got $RUNNING"
            exit 1
          fi

          echo ""
          echo "Smoke test passed: $RUNNING pods running"

      - name: Setup .NET for acceptance tests
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Generate proto code for tests
        run: buf generate

      - name: Build test project
        run: |
          dotnet restore Tests/Tests.csproj
          dotnet build Tests/Tests.csproj --configuration Release --no-restore

      - name: Run acceptance tests
        env:
          PLAYER_URL: "http://localhost:1310"
          TABLE_URL: "http://localhost:1311"
          HAND_URL: "http://localhost:1312"
        run: |
          dotnet test Tests/Tests.csproj \
            --configuration Release \
            --no-build \
            --filter "TestCategory=Acceptance|TestCategory=e2e" \
            --verbosity normal \
            --logger "console;verbosity=detailed"

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -n angzarr-test -o wide
          echo ""
          echo "=== Recent Events ==="
          kubectl get events -n angzarr-test --sort-by='.lastTimestamp' | tail -30
          echo ""
          echo "=== Pod Logs ==="
          for pod in $(kubectl get pods -n angzarr-test -o name 2>/dev/null); do
            echo "--- $pod ---"
            kubectl logs $pod -n angzarr-test --all-containers --tail=50 || true
          done

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [test, build-images, acceptance-test]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Images | ${{ needs.build-images.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Acceptance Tests | ${{ needs.acceptance-test.result }} |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.build-images.result }}" != "success" ] || \
             [ "${{ needs.acceptance-test.result }}" != "success" ]; then
            echo "One or more required jobs failed"
            exit 1
          fi
